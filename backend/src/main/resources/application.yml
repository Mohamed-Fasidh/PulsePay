spring:
  application:
    name: pulsepay-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pulsepay}
    username: ${POSTGRES_USER:pulsepay}
    password: ${POSTGRES_PASSWORD:pulsepay_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
server:
  error:
    include-message: never
  forward-headers-strategy: framework
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} request_id=%X{request_id:-} %msg%n"
pulsepay:
  simulator:
    default-outcome: ${PULSEPAY_SIMULATOR_DEFAULT_OUTCOME:success}
    random-outcomes-enabled: ${PULSEPAY_SIMULATOR_RANDOM_OUTCOMES_ENABLED:false}
  outbox:
    max-attempts: ${PULSEPAY_OUTBOX_MAX_ATTEMPTS:8}
  webhook:
    max-attempts: ${PULSEPAY_WEBHOOK_MAX_ATTEMPTS:6}

